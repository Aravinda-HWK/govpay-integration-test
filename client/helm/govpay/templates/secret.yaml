{{- /*
Manage the GO RSA private key Secret only when an inline PEM is supplied and no
pre-existing Secret is referenced. When encryption.existingSecret is set, the
operator owns the Secret and the chart only references it.
*/ -}}
{{- if and .Values.encryption.privateKey (not .Values.encryption.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-rsa" .Release.Name }}
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  {{ .Values.encryption.secretKey | default "privateKey" }}: {{ .Values.encryption.privateKey | b64enc | quote }}
{{- end }}
