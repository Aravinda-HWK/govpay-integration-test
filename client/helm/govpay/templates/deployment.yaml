apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Roll the pod when chart-managed key or logging config changes.
        checksum/config: {{ printf "%s|%s|%s" .Values.encryption.privateKey .Values.encryption.existingSecret .Values.logging.level | sha256sum }}
    spec:
      containers:
        - name: govpay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: GOVPAY_ADDR
              value: {{ .Values.env.GOVPAY_ADDR | quote }}
            - name: GOVPAY_BASIC_USER
              value: {{ .Values.env.GOVPAY_BASIC_USER | quote }}
            - name: GOVPAY_BASIC_PASS
              value: {{ .Values.env.GOVPAY_BASIC_PASS | quote }}
            - name: GOVPAY_TOKEN_TTL_SECONDS
              value: {{ .Values.env.GOVPAY_TOKEN_TTL_SECONDS | quote }}
            {{- with .Values.idp.tokenURL }}
            - name: GOVPAY_IDP_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.idp.jwksURL }}
            - name: GOVPAY_IDP_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.idp.issuer }}
            - name: GOVPAY_IDP_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.idp.audience }}
            - name: GOVPAY_IDP_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            - name: GOVPAY_LOG_LEVEL
              value: {{ .Values.logging.level | default "info" | quote }}
            # The GO RSA private key is mounted from the Secret as a read-only
            # file (see volumes below) rather than passed as an env var.
            - name: GOVPAY_RSA_PRIVATE_KEY_FILE
              value: {{ printf "%s/%s" .Values.encryption.mountPath .Values.encryption.fileName | quote }}
          volumeMounts:
            - name: rsa-private-key
              mountPath: {{ .Values.encryption.mountPath }}
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: rsa-private-key
          secret:
            secretName: {{ .Values.encryption.existingSecret | default (printf "%s-rsa" .Release.Name) }}
            # Group-readable only; OpenShift's restricted SCC assigns the pod an
            # fsGroup so the (random) container UID can read it.
            defaultMode: 0440
            items:
              - key: {{ .Values.encryption.secretKey | default "privateKey" }}
                path: {{ .Values.encryption.fileName }}
